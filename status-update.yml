name: Update current state

# Regenerates assets/current-state.svg whenever status.json changes.
# Edit status.json, push it, and this repaints the "05 — CURRENT STATE" panel.
#
# The path filter below only matches status.json. The commit this workflow makes
# only touches assets/current-state.svg, which does NOT match that filter — so
# the commit can never re-trigger this workflow. No infinite loop.
on:
  push:
    branches: [main]
    paths:
      - "status.json"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: status-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate current-state.svg
        run: node scripts/generate-current-state.mjs

      - name: Commit changes if any
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- assets/current-state.svg; then
            echo "No visual change — skipping commit."
            exit 0
          fi
          git add assets/current-state.svg
          git commit -m "chore: repaint current-state from status.json [skip ci]"
          git push
