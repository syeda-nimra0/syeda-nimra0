name: Refresh Live Data

on:
  schedule:
    # Runs at minute 0 of every hour — UTC.
    # GitHub may delay scheduled runs by a few minutes during peak load.
    # This is "hourly refresh", NOT real-time. Honest framing.
    - cron: '0 * * * *'
  workflow_dispatch: {}  # Allow manual trigger from the Actions tab.
  push:
    branches:
      - main
    paths:
      - 'scripts/generate-live-data.py'
      - '.github/workflows/refresh-live-data.yml'

permissions:
  contents: write   # Required to commit the regenerated SVGs back to the repo.

concurrency:
  group: refresh-live-data
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run the live-data generator
        env:
          # GITHUB_TOKEN is auto-provided by Actions.
          # Using it raises rate limit from 60/hr to 5000/hr.
          # NEVER create a Personal Access Token for this — the default token
          # is scoped enough to read public API + push to this repo.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/generate-live-data.py

      - name: Commit regenerated SVGs
        run: |
          git config user.name "butterfly-sys-bot"
          git config user.email "actions@github.com"
          # Only commit if the generated SVGs actually changed.
          git add assets/live-status.svg assets/recent-commits.svg assets/contribution-wing.svg
          if git diff --staged --quiet; then
            echo "No changes to commit — SVGs are up to date."
          else
            git commit -m "chore: refresh live data SVGs [skip ci]

            Auto-generated by .github/workflows/refresh-live-data.yml
            Source: GitHub REST API (public data for @syeda-nimra0)
            Generated: $(date -u +"%Y-%m-%dT%H:%M:%SZ")"
            git push
          fi
