<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" width="100%" role="img" aria-label="The butterfly left the README. Follow it to the portfolio.">
  <title>The trailer</title>
  <desc>A butterfly flying upward and out of the frame, leaving the README behind. Text reads: the butterfly left the README. it's heading somewhere bigger. follow it.</desc>

  <defs>
    <linearGradient id="trailer-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0D0612"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <radialGradient id="exit-glow" cx="50%" cy="0%" r="80%">
      <stop offset="0%" stop-color="#A456B9" stop-opacity="0.4"/>
      <stop offset="60%" stop-color="#A456B9" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#A456B9" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="320" fill="url(#trailer-bg)"/>
  <!-- Glow at top, where butterfly is heading -->
  <rect width="800" height="320" fill="url(#exit-glow)"/>

  <!-- Distant stars -->
  <g fill="#ECDBFA" opacity="0.5">
    <circle cx="100" cy="40" r="0.8"/>
    <circle cx="200" cy="60" r="0.6"/>
    <circle cx="320" cy="30" r="0.9"/>
    <circle cx="500" cy="50" r="0.7"/>
    <circle cx="620" cy="35" r="0.8"/>
    <circle cx="720" cy="55" r="0.6"/>
    <circle cx="80" cy="90" r="0.5"/>
    <circle cx="380" cy="100" r="0.6"/>
    <circle cx="580" cy="95" r="0.7"/>
  </g>

  <!-- The butterfly — animated to fly up and away -->
  <g>
    <!-- Wing flap pulse on the whole group -->
    <animateTransform attributeName="transform" type="translate" values="0,0; 0,-20; 0,-40; 0,-60; 0,-90; 0,-130; 0,-180" dur="6s" repeatCount="indefinite" additive="sum"/>
    <g transform="translate(400, 200)">
      <!-- Wing flap subgroup (scale-x compression to suggest flap) -->
      <g>
        <animateTransform attributeName="transform" type="scale" values="1,1; 0.7,1; 1,1; 0.7,1; 1,1" dur="0.6s" repeatCount="indefinite"/>
        <!-- Left wing -->
        <path d="M 0 0 Q -40 -35 -55 -15 Q -65 8 -42 22 Q -18 25 0 8 Z" fill="#A456B9" opacity="0.92"/>
        <path d="M 0 0 Q -32 -25 -45 -10 Q -50 5 -32 12 Z" fill="#ECDBFA" opacity="0.4"/>
        <circle cx="-30" cy="-5" r="3" fill="#ECDBFA"/>
        <circle cx="-20" cy="10" r="2" fill="#ECDBFA"/>
        <circle cx="-40" cy="5" r="1.5" fill="#0D0612"/>

        <!-- Right wing -->
        <path d="M 0 0 Q 40 -35 55 -15 Q 65 8 42 22 Q 18 25 0 8 Z" fill="#A456B9" opacity="0.92"/>
        <path d="M 0 0 Q 32 -25 45 -10 Q 50 5 32 12 Z" fill="#ECDBFA" opacity="0.4"/>
        <circle cx="30" cy="-5" r="3" fill="#ECDBFA"/>
        <circle cx="20" cy="10" r="2" fill="#ECDBFA"/>
        <circle cx="40" cy="5" r="1.5" fill="#0D0612"/>
      </g>

      <!-- Body -->
      <ellipse cx="0" cy="0" rx="3" ry="28" fill="#0D0612"/>
      <!-- Head -->
      <circle cx="0" cy="-32" r="5" fill="#0D0612"/>
      <!-- Antennae -->
      <path d="M 0 -36 Q -8 -46 -14 -52" stroke="#0D0612" stroke-width="1.4" fill="none"/>
      <path d="M 0 -36 Q 8 -46 14 -52" stroke="#0D0612" stroke-width="1.4" fill="none"/>
      <circle cx="-14" cy="-52" r="2" fill="#A456B9"/>
      <circle cx="14" cy="-52" r="2" fill="#A456B9"/>

      <!-- Soft trail behind butterfly -->
      <circle cx="0" cy="35" r="3" fill="#A456B9" opacity="0.3">
        <animate attributeName="opacity" values="0.3;0;0.3" dur="0.6s" repeatCount="indefinite"/>
      </circle>
      <circle cx="0" cy="50" r="2" fill="#A456B9" opacity="0.2">
        <animate attributeName="opacity" values="0.2;0;0.2" dur="0.8s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>

  <!-- Text below -->
  <text x="400" y="200" text-anchor="middle" font-family="'Bebas Neue','Arial Narrow',sans-serif" font-size="24" fill="#ECDBFA" letter-spacing="4">THE BUTTERFLY LEFT THE README.</text>
  <text x="400" y="228" text-anchor="middle" font-family="'Montserrat',sans-serif" font-size="14" fill="#9B8AA8" font-style="italic">it's heading somewhere bigger.</text>

  <!-- CTA -->
  <text x="400" y="278" text-anchor="middle" font-family="'JetBrains Mono','Courier New',monospace" font-size="13" fill="#A456B9" letter-spacing="4">→ FOLLOW IT TO THE STUDIO</text>
  <text x="400" y="298" text-anchor="middle" font-family="'Montserrat',sans-serif" font-size="11" fill="#9B8AA8">syedanimra.site.je</text>
</svg>
