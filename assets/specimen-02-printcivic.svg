<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="100%" role="img" aria-label="Specimen 02 — Printcivic">
  <title>Specimen 02 — Printcivic</title>
  <desc>A dark premium studio site for Printcivic.ng, a brand identity and commercial print studio in Ibadan, Nigeria, founded by Alabi Mubarak Babatunde. Built with Vite + Tailwind v4 + Lucide.</desc>

  <rect width="800" height="200" fill="#1A0F22" rx="8"/>
  <rect x="0" y="0" width="800" height="2" fill="#A456B9" opacity="0.5"/>

  <!-- Specimen number -->
  <text x="30" y="40" font-family="'Bebas Neue','Arial Narrow',sans-serif" font-size="36" fill="#A456B9" letter-spacing="2">02</text>
  <text x="30" y="58" font-family="'JetBrains Mono','Courier New',monospace" font-size="9" fill="#9B8AA8" letter-spacing="2">SPECIMEN</text>

  <!-- Title -->
  <text x="30" y="100" font-family="'Bebas Neue','Arial Narrow',sans-serif" font-size="26" fill="#ECDBFA" letter-spacing="2">PRINTCIVIC</text>
  <text x="30" y="118" font-family="'Montserrat',sans-serif" font-size="12" fill="#9B8AA8" font-style="italic">brand identity + commercial print studio · Ibadan, Nigeria</text>

  <!-- Verified build stack -->
  <g transform="translate(30, 138)">
    <text x="0" y="0" font-family="'JetBrains Mono','Courier New',monospace" font-size="10" fill="#9B8AA8" letter-spacing="1">BUILD</text>
    <text x="50" y="0" font-family="'JetBrains Mono','Courier New',monospace" font-size="10" fill="#ECDBFA">Vite + Tailwind v4 + Lucide + Cloudinary</text>
  </g>
  <g transform="translate(30, 158)">
    <text x="0" y="0" font-family="'JetBrains Mono','Courier New',monospace" font-size="10" fill="#9B8AA8" letter-spacing="1">NOTE</text>
    <text x="50" y="0" font-family="'Montserrat',sans-serif" font-size="11" fill="#F5F0FA">dark premium studio · General Sans + Clash Display · real client work</text>
  </g>

  <!-- Palette strip — extracted from live site -->
  <g transform="translate(560, 30)">
    <text x="0" y="0" font-family="'JetBrains Mono','Courier New',monospace" font-size="9" fill="#9B8AA8" letter-spacing="2">PALETTE</text>
    <rect x="0" y="10" width="40" height="80" fill="#080c0f"/>
    <rect x="42" y="10" width="40" height="80" fill="#013452"/>
    <rect x="84" y="10" width="40" height="80" fill="#016fa8"/>
    <rect x="126" y="10" width="40" height="80" fill="#1f93cf"/>
    <rect x="168" y="10" width="40" height="80" fill="#ffffff"/>
    <text x="0" y="105" font-family="'Montserrat',sans-serif" font-size="9" fill="#9B8AA8">near-black · deep blue · blue · light blue · white</text>
  </g>

  <!-- Visit link -->
  <a href="https://printcivic.netlify.app/" target="_blank" rel="noopener">
    <text x="770" y="185" text-anchor="end" font-family="'Bebas Neue','Arial Narrow',sans-serif" font-size="16" fill="#A456B9" letter-spacing="3">OBSERVE SPECIMEN →</text>
  </a>
