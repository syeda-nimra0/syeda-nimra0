<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 80" width="100%" role="img" aria-label="BUTTERFLY.SYS — a small machine that turns caffeine into websites">
  <title>BUTTERFLY.SYS</title>
  <desc>The system name for the README: a small machine that turns caffeine into websites.</desc>

  <rect width="240" height="80" fill="#000000"/>

  <!-- Tiny butterfly to the left -->
  <g transform="translate(28, 40)">
    <g>
      <animateTransform attributeName="transform" type="scale" values="1,1; 0.7,1; 1,1" dur="3.2s" repeatCount="indefinite"/>
      <!-- Left wing -->
      <path d="M 0 0 Q -14 -12 -18 -4 Q -20 4 -14 8 Q -6 9 0 3 Z" fill="#A456B9" opacity="0.9"/>
      <circle cx="-10" cy="-1" r="1" fill="#ECDBFA"/>
      <!-- Right wing -->
      <path d="M 0 0 Q 14 -12 18 -4 Q 20 4 14 8 Q 6 9 0 3 Z" fill="#A456B9" opacity="0.9"/>
      <circle cx="10" cy="-1" r="1" fill="#ECDBFA"/>
    </g>
    <!-- Body -->
    <ellipse cx="0" cy="0" rx="1" ry="10" fill="#0D0612"/>
    <circle cx="0" cy="-12" r="1.5" fill="#0D0612"/>
    <path d="M 0 -14 Q -3 -17 -5 -19" stroke="#0D0612" stroke-width="0.6" fill="none"/>
    <path d="M 0 -14 Q 3 -17 5 -19" stroke="#0D0612" stroke-width="0.6" fill="none"/>
  </g>

  <!-- Wordmark -->
  <text x="62" y="38" font-family="'Bebas Neue','Arial Narrow',sans-serif" font-size="20" fill="#ECDBFA" letter-spacing="3">BUTTERFLY</text>
  <text x="62" y="58" font-family="'JetBrains Mono','Courier New',monospace" font-size="11" fill="#A456B9" letter-spacing="2">.SYS</text>

  <!-- Tagline -->
  <text x="62" y="72" font-family="'Montserrat',sans-serif" font-size="7" fill="#9B8AA8" font-style="italic">a small machine that turns caffeine into websites</text>

  <!-- Subtle status dot on the right -->
  <circle cx="220" cy="20" r="3" fill="#A456B9">
    <animate attributeName="opacity" values="1;0.35;1" dur="2.4s" repeatCount="indefinite"/>
  </circle>
  <text x="216" y="32" text-anchor="end" font-family="'JetBrains Mono',monospace" font-size="7" fill="#9B8AA8" letter-spacing="1">v0.0.1</text>
</svg>
