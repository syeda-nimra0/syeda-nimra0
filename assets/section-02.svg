<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 80" width="100%" role="img" aria-label="Section 02 — Live signal from GitHub">
  <title>Section 02 — Live signal from GitHub</title>
  <desc>Section divider for the live GitHub activity section.</desc>
  <rect width="800" height="80" fill="#000000"/>
  <line x1="0" y1="40" x2="280" y2="40" stroke="#2B1A35" stroke-width="1"/>
  <line x1="520" y1="40" x2="800" y2="40" stroke="#2B1A35" stroke-width="1"/>
  <text x="400" y="46" text-anchor="middle" font-family="'JetBrains Mono','Courier New',monospace" font-size="11" fill="#9B8AA8" letter-spacing="4">02</text>
  <text x="400" y="32" text-anchor="middle" font-family="'Bebas Neue','Arial Narrow',sans-serif" font-size="22" fill="#ECDBFA" letter-spacing="6">LIVE SIGNAL FROM GITHUB</text>
  <circle cx="280" cy="40" r="2" fill="#A456B9">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="2.4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="520" cy="40" r="2" fill="#A456B9">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="2.4s" repeatCount="indefinite"/>
  </circle>
</svg>
